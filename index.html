<style>
:root{
  --charcoal:#1E2730; --offwhite:#F5F1E8; --orange:#E8762C;
  --pine:#3E6B4F; --steel:#5B7C99;
  --line:rgba(245,241,232,.14);
  --sidebar:340px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--charcoal);color:var(--offwhite);overflow:hidden;
}
h1,h2,.count,.chip{font-family:Oswald,Inter,system-ui,sans-serif;letter-spacing:.02em}

#app{display:flex;height:100%}

/* ---------------------------------------------------------------- sidebar */
#side{
  width:var(--sidebar);flex:0 0 var(--sidebar);height:100%;
  display:flex;flex-direction:column;background:var(--charcoal);
  border-right:1px solid var(--line);z-index:1000;
}
#brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
#brand h1{margin:0;font-size:23px;font-weight:600;text-transform:uppercase}
#brand h1 span{color:var(--orange)}
#brand p{margin:5px 0 0;font-size:12.5px;color:rgba(245,241,232,.62);line-height:1.45}
.count{margin-top:11px;font-size:12px;color:var(--orange);text-transform:uppercase}

#tools{padding:14px 20px;border-bottom:1px solid var(--line)}
#q{
  width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);
  background:rgba(245,241,232,.06);color:var(--offwhite);font:inherit;font-size:13.5px;
}
#q::placeholder{color:rgba(245,241,232,.4)}
#q:focus{outline:none;border-color:var(--orange)}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{
  font-size:11px;text-transform:uppercase;padding:5px 10px;border-radius:20px;
  border:1px solid var(--line);background:none;color:rgba(245,241,232,.66);
  cursor:pointer;transition:.15s;
}
.chip:hover{border-color:rgba(245,241,232,.4);color:var(--offwhite)}
.chip.on{background:var(--orange);border-color:var(--orange);color:#1a1207;font-weight:600}

#list{flex:1;overflow-y:auto;padding:6px 0 20px}
.row{
  display:flex;align-items:baseline;gap:9px;padding:8px 20px;cursor:pointer;
  border-left:2px solid transparent;
}
.row:hover{background:rgba(245,241,232,.055);border-left-color:var(--orange)}
.row b{font-weight:500;font-size:13.5px}
.row i{font-style:normal;font-size:11px;color:rgba(245,241,232,.42);margin-left:auto}
.empty{padding:26px 20px;font-size:13px;color:rgba(245,241,232,.45)}

#foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11px;
      color:rgba(245,241,232,.42);display:flex;justify-content:space-between;gap:10px}
#foot a{color:var(--orange);text-decoration:none}
#foot a:hover{text-decoration:underline}

/* ---------------------------------------------------------------- map */
#map{flex:1;height:100%;background:#20272e}
.leaflet-container{font-family:Inter,system-ui,sans-serif}

.pin{
  width:15px;height:15px;border-radius:50%;
  background:var(--orange);border:2.5px solid var(--offwhite);
  box-shadow:0 1px 5px rgba(0,0,0,.5);
}
.cluster{
  background:var(--orange);color:#1a1207;border:3px solid var(--offwhite);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Oswald,sans-serif;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.45);
}

.leaflet-popup-content-wrapper{
  background:var(--charcoal);color:var(--offwhite);border-radius:10px;
  border:1px solid var(--line);box-shadow:0 10px 34px rgba(0,0,0,.5);
}
.leaflet-popup-content{margin:0;width:296px!important}
.leaflet-popup-tip{background:var(--charcoal);border:1px solid var(--line)}
.leaflet-popup-close-button{color:rgba(245,241,232,.6)!important;padding:8px 9px 0 0!important}
.leaflet-popup-close-button:hover{color:var(--offwhite)!important}

.pop h2{margin:0;padding:13px 15px 3px;font-size:16.5px;font-weight:600}
.pop .sub{padding:0 15px 11px;font-size:11.5px;color:rgba(245,241,232,.5);
          text-transform:uppercase;letter-spacing:.04em}
.media{line-height:0;background:#000}
.thumb{position:relative;display:block;line-height:0;background:#000;cursor:pointer}
.thumb img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.thumb .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.thumb .play span{
  width:52px;height:37px;border-radius:9px;background:rgba(232,118,44,.94);
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.thumb:hover .play span{background:var(--orange);transform:scale(1.07)}
.thumb .play svg{width:17px;height:17px;fill:#fff;margin-left:2px}
.pop iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.pop .more{display:flex;flex-wrap:wrap;gap:6px;padding:10px 15px 0}
.pop .more button{
  font:inherit;font-size:11px;padding:4px 9px;border-radius:5px;cursor:pointer;
  background:rgba(245,241,232,.09);border:1px solid var(--line);color:var(--offwhite);
}
.pop .more button:hover{border-color:var(--orange)}
.pop .more button.on{background:var(--orange);color:#1a1207;border-color:var(--orange)}
.pop .yt{display:block;padding:11px 15px 13px;font-size:12px;color:var(--orange);
         text-decoration:none}
.pop .yt:hover{text-decoration:underline}

/* ---------------------------------------------------------------- mobile */
#burger{
  display:none;position:absolute;top:12px;left:12px;z-index:1200;
  background:var(--charcoal);color:var(--offwhite);border:1px solid var(--line);
  border-radius:8px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer;
}
@media (max-width:760px){
  #burger{display:block}
  #side{
    position:absolute;inset:0 auto 0 0;transform:translateX(-100%);
    transition:transform .22s ease;width:86%;max-width:340px;
  }
  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #brand{padding-left:60px}
}
</style>
</head>

var map = L.map('map', {zoomControl:true, worldCopyJump:true})
           .setView([39.5,-96.5], 4);

// Both of these are key-free. CARTO's used to be and isn't any more, which is
// why there are two: if one starts demanding a key, switch in the corner.
var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);
var light = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  {maxZoom: 16, attribution:'Esri, HERE, Garmin, &copy; OpenStreetMap contributors'});
L.control.layers({'Streets': streets, 'Light': light}, null,
                 {position:'topright'}).addTo(map);

var icon = L.divIcon({className:'', html:'<div class="pin"></div>',
                      iconSize:[15,15], iconAnchor:[7,7], popupAnchor:[0,-9]});

var cluster = L.markerClusterGroup({
  maxClusterRadius: 46,
  showCoverageOnHover: false,
  iconCreateFunction: function(c){
    var n = c.getChildCount(), s = n < 10 ? 34 : n < 100 ? 40 : 48;
    return L.divIcon({html:'<div class="cluster" style="width:'+s+'px;height:'+s+'px;'+
                            'font-size:'+(n<100?13:12)+'px">'+n+'</div>',
                      className:'', iconSize:[s,s]});
  }
});

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function popupHTML(p, i){
  i = i || 0;
  var id = p.v[i];
  // The heading is already the city, so the line under it is state + region,
  // not "Greenville, Greenville MI".
  var sub = [p.s, p.r].filter(Boolean).join(' · ') || '';
  var h = '<div class="pop" data-name="'+esc(p.n)+'">'
        + '<h2>'+esc(p.c || p.n)+'</h2>'
        + '<div class="sub">'+esc(sub)+'</div>'
        + '<div class="media">'
        +   '<div class="thumb" data-id="'+id+'">'
        +     '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/'+id+'/hqdefault.jpg">'
        +     '<div class="play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></div>'
        +   '</div>'
        + '</div>';
  if (p.v.length > 1){
    h += '<div class="more">';
    for (var k=0;k<p.v.length;k++)
      h += '<button data-i="'+k+'"'+(k===i?' class="on"':'')+'>Video '+(k+1)+'</button>';
    h += '</div>';
  }
  h += '<a class="yt" href="https://www.youtube.com/watch?v='+id+'" target="_blank" '
     + 'rel="noopener">Watch on YouTube →</a></div>';
  return h;
}

var markers = [];
PINS.forEach(function(p){
  var m = L.marker([p.y, p.x], {icon:icon, title:p.n});
  m.bindPopup(function(){ return popupHTML(p, 0); }, {minWidth:296, maxWidth:296});
  m.pin = p;
  markers.push(m);
});
cluster.addLayers(markers);
map.addLayer(cluster);

// Click the thumbnail to play in place; switch videos on a multi-video pin.
map.on('popupopen', function(e){
  var el = e.popup.getElement();
  var p  = e.popup._source && e.popup._source.pin;
  if (!el || !p) return;

  // Without this a click inside the popup reaches the map and closePopupOnClick
  // shuts the popup -- which is what used to kill the player the instant it was
  // created, because swapping the thumbnail out detached the clicked node.
  L.DomEvent.disableClickPropagation(el);

  el.addEventListener('click', function(ev){
    var t = ev.target.closest('.thumb');
    if (t){
      L.DomEvent.stop(ev);
      // Fill a container that STAYS in the DOM rather than replacing the node
      // the click landed on.
      var media = t.parentNode;
      media.innerHTML =
        '<iframe src="https://www.youtube.com/embed/'+t.dataset.id
        + '?autoplay=1&rel=0&playsinline=1" allowfullscreen '
        + 'allow="accelerometer; autoplay; encrypted-media; picture-in-picture">'
        + '</iframe>';
      return;
    }
    var b = ev.target.closest('.more button');
    if (b){
      L.DomEvent.stop(ev);
      e.popup.setContent(popupHTML(p, +b.dataset.i));
    }
  });
});

// ------------------------------------------------------------- sidebar
var regions = [];
PINS.forEach(function(p){ if (regions.indexOf(p.r) < 0) regions.push(p.r); });
regions.sort();
var active = {};
regions.forEach(function(r){ active[r] = true; });

var chips = document.getElementById('chips');
regions.forEach(function(r){
  var b = document.createElement('button');
  b.className = 'chip on';
  b.textContent = r;
  b.onclick = function(){
    active[r] = !active[r];
    b.classList.toggle('on', active[r]);
    render();
  };
  chips.appendChild(b);
});

var q = document.getElementById('q'), list = document.getElementById('list'),
    shown = document.getElementById('shown');

function matches(p){
  if (!active[p.r]) return false;
  var s = q.value.trim().toLowerCase();
  if (!s) return true;
  return (p.n + ' ' + p.c + ' ' + p.s + ' ' + p.r).toLowerCase().indexOf(s) >= 0;
}

function render(){
  var keep = [];
  cluster.clearLayers();
  list.innerHTML = '';
  markers.forEach(function(m){ if (matches(m.pin)) keep.push(m); });
  cluster.addLayers(keep);
  shown.textContent = keep.length;
  if (!keep.length){
    list.innerHTML = '<div class="empty">Nothing matches that.</div>';
    return;
  }
  var frag = document.createDocumentFragment();
  keep.slice(0, 400).forEach(function(m){
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<b>' + esc(m.pin.c || m.pin.n) + '</b>'
                  + '<i>' + esc(m.pin.s || m.pin.r) + '</i>';
    row.onclick = function(){
      map.setView([m.pin.y, m.pin.x], Math.max(map.getZoom(), 9), {animate:true});
      cluster.zoomToShowLayer(m, function(){ m.openPopup(); });
      if (window.innerWidth <= 760) side.classList.remove('open');
    };
    frag.appendChild(row);
  });
  list.appendChild(frag);
}
q.addEventListener('input', render);
render();

var side = document.getElementById('side');
document.getElementById('burger').onclick = function(){ side.classList.toggle('open'); };
</script>
